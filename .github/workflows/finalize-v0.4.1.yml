name: Diagnose npm package state

on:
  push:
    branches:
      - "release/v0.4.1-finalize"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Query public npm registry state
        run: |
          set +e
          echo "PACKAGE_LOOKUP_BEGIN"
          npm view codex-scope-inspector version --json
          echo "PACKAGE_VERSION_EXIT=$?"
          npm view codex-scope-inspector versions --json
          echo "PACKAGE_VERSIONS_EXIT=$?"
          npm view codex-scope-inspector repository.url --json
          echo "PACKAGE_REPOSITORY_EXIT=$?"
          echo "PACKAGE_LOOKUP_END"
          exit 0
