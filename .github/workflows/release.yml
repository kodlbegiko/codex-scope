name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release notes
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Codex Scope $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --verify-tag
          fi
