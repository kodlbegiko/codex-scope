name: October refresh materializer

on:
  push:
    branches: [conformance/october-2026-refresh]
    paths:
      - scripts/materialize-october-refresh.mjs
      - .github/workflows/october-refresh-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conformance/october-2026-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global typescript@5.8.3
      - run: npm ci
      - run: npm run build
      - run: node scripts/materialize-october-refresh.mjs
      - name: Reverify compatibility metadata against audited upstream pin
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const SHA = '970111f6cb62cc02fe36a82ea7d71b37a2889c97';
          const DATE = '2026-10-26';
          const RULE_ID = 'codex.compatibility.unknown_version';
          const SNAPSHOT = 'conformance/snapshots/codex-2026-10-26-970111f6-corpus57.json';

          const manifestPath = 'conformance/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const rule = manifest.rules.find((item) => item.rule_id === RULE_ID);
          if (!rule) throw new Error(`missing ${RULE_ID}`);
          const pinAssertion = rule.assertions.find(
            (item) => JSON.stringify(item.path) === JSON.stringify(['tested_upstream_commit']) && item.operator === 'equals',
          );
          if (!pinAssertion) throw new Error(`missing tested_upstream_commit assertion for ${RULE_ID}`);
          pinAssertion.value = SHA;
          rule.evidence_date = DATE;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const snapshot = JSON.parse(fs.readFileSync(SNAPSHOT, 'utf8'));
          const semantic = snapshot.semantic_rules.find((item) => item.rule_id === RULE_ID);
          if (!semantic) throw new Error(`missing ${RULE_ID} in October snapshot`);
          semantic.evidence_state = 'verified';
          semantic.evidence_date = DATE;
          semantic.evidence_commit_or_version = SHA;
          fs.writeFileSync(SNAPSHOT, JSON.stringify(snapshot, null, 2) + '\n');

          const docPath = 'docs/research/codex-conformance-coverage.md';
          let doc = fs.readFileSync(docPath, 'utf8');
          doc = doc
            .replace('- unchanged: 1', '- unchanged: 2')
            .replace('- evidence_gap: 50', '- evidence_gap: 49')
            .replace(
              'The single reverified existing rule is the active CODEX_HOME project-layer exclusion. The 50 evidence gaps are deliberate:',
              'The two reverified existing rules are the active CODEX_HOME project-layer exclusion and the compatibility metadata pin. The 49 evidence gaps are deliberate:',
            );
          fs.writeFileSync(docPath, doc);
          NODE
      - run: sed -i 's/[[:space:]]\+$//' docs/research/codex-conformance-coverage.md
      - name: Sync Phase 2 derived coverage ledger
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('conformance/manifest.json', 'utf8'));
          const coveragePath = 'conformance/research/phase-2-coverage.json';
          const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
          const fixturePaths = new Set();
          const fixtureProbeShapes = new Set();
          let assertions = 0;
          let regressionRules = 0;
          const surfaces = {};
          for (const rule of manifest.rules) {
            fixturePaths.add(rule.fixture.path);
            fixtureProbeShapes.add(JSON.stringify({ path: rule.fixture.path, probe: rule.fixture.probe }));
            assertions += Array.isArray(rule.assertions) ? rule.assertions.length : 0;
            if (rule.regression === true) regressionRules += 1;
            surfaces[rule.surface] = (surfaces[rule.surface] ?? 0) + 1;
          }
          const codexCases = manifest.rules.length;
          const geminiCases = coverage.calculation.gemini_research_cases;
          coverage.calculation.codex_rule_fixture_cases = codexCases;
          coverage.calculation.total = codexCases + geminiCases;
          coverage.codex.rule_fixture_cases = codexCases;
          coverage.codex.unique_fixture_paths = fixturePaths.size;
          coverage.codex.unique_fixture_probe_shapes = fixtureProbeShapes.size;
          coverage.codex.assertions = assertions;
          coverage.codex.regression_rules = regressionRules;
          coverage.codex.surfaces = surfaces;
          fs.writeFileSync(coveragePath, JSON.stringify(coverage, null, 2) + '\n');
          console.log(JSON.stringify({ codexCases, fixturePaths: fixturePaths.size, fixtureProbeShapes: fixtureProbeShapes.size, assertions, regressionRules, surfaces, total: coverage.calculation.total }, null, 2));
          NODE
      - run: npm run conformance:matrix
      - run: npm run conformance:history
      - name: Diagnose conformance before full check
        run: node scripts/conformance-check.mjs --json || true
      - run: npm run check
      - name: Commit generated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "conformance: materialize October 2026 evidence refresh"
          git push origin HEAD:conformance/october-2026-refresh
